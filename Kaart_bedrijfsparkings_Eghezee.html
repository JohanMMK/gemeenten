if(boundary){bl=L.geoJSON(boundary,{style:{color:'#1F3864',weight:3,fill:true,fillColor:'#1F3864',fillOpacity:0.04}}).addTo(map);}
function col(p){return p>=100?'#1F3864':p>=50?'#05B050':p>=25?'#9E480E':'#888';}
function sz(p){return p>=100?40:p>=50?34:p>=25?28:24;}
var pts=[];
sites.forEach(function(s){var z=sz(s.p);
var inner=s.o?'':s.p;
var stl=s.o?'width:'+z+'px;height:'+z+'px;background:'+col(s.p)+';border:2px solid rgba(255,255,255,.55);opacity:.4;box-shadow:none':'width:'+z+'px;height:'+z+'px;background:'+col(s.p)+';border:2px solid #fff';
var ic=L.divIcon({className:'',html:'<div class="pin" style="'+stl+'">'+inner+'</div>',iconSize:[z,z],iconAnchor:[z/2,z/2]});
var sat='https://www.google.com/maps/@'+s.lat+','+s.lng+',150m/data=!3m1!1e3';
L.marker([s.lat,s.lng],{icon:ic}).addTo(map).bindPopup('<b>'+s.n+'</b><br>'+s.t+'<br><b>&asymp; '+s.p+' plaatsen</b>'+(s.o?'<br><i>in de band van \u00b12 km rond de grens</i>':'')+'<br><a href="'+sat+'" target="_blank">Satelliet</a>');
pts.push([s.lat,s.lng]);});
var cabines=[];
var cabLayer=L.layerGroup();
cabines.forEach(function(c){
var m=L.circleMarker([c.la,c.lo],{radius:5,color:'#6b5300',weight:1,fillColor:'#FFD400',fillOpacity:0.95});
var info='<b>MS-cabine '+c.n+'</b>';
if(c.a)info+='<br>Restcapaciteit afname: '+c.a;
if(c.i)info+='<br>Restcapaciteit injectie: '+c.i;
if(c.v)info+='<br>Voeding: '+c.v;
m.bindTooltip(info,{direction:'top',sticky:true});
m.bindPopup(info);
cabLayer.addLayer(m);});
cabLayer.addTo(map);
var chargers=[];
var chgLayer=L.layerGroup();
chargers.forEach(function(c){
var ic=L.divIcon({className:'',html:'<div class="pin" style="width:22px;height:22px;background:#05B050;border:2px solid #fff;font-size:13px">&#9889;</div>',iconSize:[22,22],iconAnchor:[11,11]});
var m=L.marker([c.la,c.lo],{icon:ic});
var info='<b>Bestaand snellaadpunt</b>'+(c.n?'<br>'+c.n:'')+'<br>&asymp; '+c.kw+' kW';
m.bindTooltip(info,{direction:'top',sticky:true});m.bindPopup(info);
chgLayer.addLayer(m);});
chgLayer.addTo(map);
var _ov={};
if(cabines.length)_ov['\u25CF MS-cabines ('+cabines.length+')']=cabLayer;
if(chargers.length)_ov['&#9889; Snelladen &ge;40 kW ('+chargers.length+')']=chgLayer;
if(Object.keys(_ov).length)L.control.layers(null,_ov,{collapsed:false,position:'topright'}).addTo(map);
var allPts=pts.slice();
cabines.forEach(function(c){allPts.push([c.la,c.lo]);});
if(bl){var bb=bl.getBounds();allPts.push([bb.getSouth(),bb.getWest()],[bb.getNorth(),bb.getEast()]);}
if(allPts.length){map.fitBounds(allPts,{padding:[30,30]});}
else{map.setView([50.5,4.7],9);}
</script></body></html>
