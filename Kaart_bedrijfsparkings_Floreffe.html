L.marker([s.lat,s.lng],{icon:ic}).addTo(map).bindPopup('<b>'+s.n+'</b><br>'+s.t+'<br><b>&asymp; '+s.p+' plaatsen</b>'+(s.o?'<br><i>in de band van \u00b12 km rond de grens</i>':'')+'<br><a href="'+sat+'" target="_blank">Satelliet</a>');
pts.push([s.lat,s.lng]);});
var cabines=[];
var cabLayer=L.layerGroup();
cabines.forEach(function(c){
var m=L.circleMarker([c.la,c.lo],{radius:5,color:'#6b5300',weight:1,fillColor:'#FFD400',fillOpacity:0.95});
var info='<b>MS-cabine '+c.n+'</b>';
if(c.a)info+='<br>Restcapaciteit afname: '+c.a;
if(c.i)info+='<br>Restcapaciteit injectie: '+c.i;
if(c.v)info+='<br>Voeding: '+c.v;
m.bindTooltip(info,{direction:'top',sticky:true});
m.bindPopup(info);
cabLayer.addLayer(m);});
cabLayer.addTo(map);
if(cabines.length){var cabOv={};cabOv['\u25CF MS-cabines ('+cabines.length+')']=cabLayer;L.control.layers(null,cabOv,{collapsed:false,position:'topright'}).addTo(map);}
var allPts=pts.slice();
cabines.forEach(function(c){allPts.push([c.la,c.lo]);});
if(bl){var bb=bl.getBounds();allPts.push([bb.getSouth(),bb.getWest()],[bb.getNorth(),bb.getEast()]);}
if(allPts.length){map.fitBounds(allPts,{padding:[30,30]});}
else{map.setView([50.5,4.7],9);}
</script></body></html>
